[package]
name = "llmtop"
version = "0.1.0"
edition = "2024"
# sysinfo 0.39 needs 1.95.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
